name: Format check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install JuliaFormatter and check formatting
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="1"))'
          julia -e 'using JuliaFormatter; format(".", verbose=true) || exit(1); if !isempty(read(`git diff`, String)); println(read(`git diff`, String)); exit(1); end'
