name: Documentation
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  contents: write
  pull-requests: read
  statuses: write
jobs:
  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GKSwstype: "100"        # headless GR for the vignette plots
      JULIA_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.28
      - name: Instantiate the vignettes environment
        run: julia --project=vignettes -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Render the vignettes
        working-directory: vignettes
        run: quarto render
      - name: Instantiate the docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Build and deploy the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
